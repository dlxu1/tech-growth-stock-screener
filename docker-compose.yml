services:
  dashboard:
    build:
      context: .
      args:
        APT_MIRROR: https://mirrors.aliyun.com/debian
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
    image: tech-growth-stock-screener:latest
    container_name: tech-growth-dashboard
    restart: unless-stopped
    command: ["python", "scripts/run.py", "dashboard-server", "--source", "cache", "--host", "0.0.0.0", "--port", "5001", "--no-recent-high-good-hits"]
    ports:
      - "5001:5001"
    volumes:
      - ./nas-cache:/app/.cache
    environment:
      TZ: Asia/Shanghai
      TECH_GROWTH_SCREENER_CACHE: /app/.cache
      TECH_GROWTH_DB: /app/.cache/stock_data.sqlite

  update:
    build:
      context: .
      args:
        APT_MIRROR: https://mirrors.aliyun.com/debian
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
    image: tech-growth-stock-screener:latest
    profiles:
      - manual
    volumes:
      - ./nas-cache:/app/.cache
    environment:
      TZ: Asia/Shanghai
      TECH_GROWTH_SCREENER_CACHE: /app/.cache
      TECH_GROWTH_DB: /app/.cache/stock_data.sqlite
    command: ["python", "scripts/docker_update.py"]
